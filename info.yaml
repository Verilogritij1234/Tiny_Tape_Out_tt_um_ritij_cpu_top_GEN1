# Tiny Tapeout project information
project:
  title:        "32-bit cpu"     
  author:       "Ritij Kauhsal"      
  discord:      ""      
  description:  "A 32-bit CPU with multiplexed outputs"      
  language:     "Verilog" 
  clock_hz:     50000000       

  # Increased area to fit the 32-bit registers, RAM, and ROM
  tiles: "3x2"          

  # Updated to match the wrapper module name
  top_module:  "tt_um_cpu"

  # You MUST list every file that makes up the CPU here
  source_files:
    - tt_um_cpu.v
    - cpu_top.v
    - alu.v
    - rom.v
    - control_unit.v
    - alu_control.v
    - regfile.v
    - parameterized_RAM.v

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "Interrupt Request (IRQ)"
  ui[1]: "Output Byte Select"
  ui[2]: "Output Byte Select"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "Muxed CPU Data Out"
  uo[1]: "Muxed CPU Data Out"
  uo[2]: "Muxed CPU Data Out"
  uo[3]: "Muxed CPU Data Out"
  uo[4]: "Muxed CPU Data Out"
  uo[5]: "Muxed CPU Data Out"
  uo[6]: "Muxed CPU Data Out"
  uo[7]: "Muxed CPU Data Out"

  # Bidirectional pins (Unused, tied off in wrapper)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
